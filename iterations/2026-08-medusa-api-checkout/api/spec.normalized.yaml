    Product:
      type: object
      required: [id, handle, variants]
      properties:
        id: {type: string}
        handle: {type: string}
        variants: {type: array, items: {$ref: "#/components/schemas/ProductVariant"}}
    ProductVariant:
      type: object
      required: [id, title, sku, calculated_price]
      properties:
        id: {type: string}
        title: {type: string}
        sku: {type: string}
