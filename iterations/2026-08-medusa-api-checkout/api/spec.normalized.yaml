endpoints:
  - operation_id: listStoreProducts
    path: /store/products
    method: GET
    summary: 查询 T-Shirt 与运行时商品变体
    module: checkout
    requirement_ids: [R0001]
    authentication: x-publishable-api-key
    parameters:
      - name: handle
        in: query
        required: true
        schema: {type: string}
      - name: region_id
        in: query
        required: true
        schema: {type: string}
      - name: fields
        in: query
        required: false
        schema: {type: string}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/ProductListResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: createStoreCart
    path: /store/carts
    method: POST
    summary: 按运行时地区建立游客购物车
    module: checkout
    requirement_ids: [R0001]
    authentication: x-publishable-api-key
    parameters: []
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/CreateCartRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/CartResponse"}
      - status_code: 404
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: addStoreCartLineItem
    path: /store/carts/{id}/line-items
    method: POST
    summary: 向购物车加入黑色 S 码变体
    module: checkout
    requirement_ids: [R0001]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/AddLineItemRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/CartResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: applyStoreCartPromotions
    path: /store/carts/{id}/promotions
    method: POST
    summary: 应用 ARGUS10 促销码
    module: checkout
    requirement_ids: [R0002, R0004]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/ApplyPromotionsRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/CartResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: updateStoreCart
    path: /store/carts/{id}
    method: POST
    summary: 写入游客邮箱和配送地址
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/UpdateCartRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/CartResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: listStoreShippingOptions
    path: /store/shipping-options
    method: GET
    summary: 查询当前购物车可用配送方式
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters:
      - name: cart_id
        in: query
        required: true
        schema: {type: string}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/ShippingOptionListResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: addStoreCartShippingMethod
    path: /store/carts/{id}/shipping-methods
    method: POST
    summary: 选择 Standard Shipping
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/AddShippingMethodRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/CartResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: createStorePaymentCollection
    path: /store/payment-collections
    method: POST
    summary: 为购物车初始化支付集合
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters: []
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/CreatePaymentCollectionRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/PaymentCollectionResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: initializeStorePaymentSession
    path: /store/payment-collections/{id}/payment-sessions
    method: POST
    summary: 选择隔离测试用 Manual Payment
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    request_body:
      content_type: application/json
      schema: {$ref: "#/components/schemas/InitializePaymentSessionRequest"}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/PaymentCollectionResponse"}
      - status_code: 400
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
  - operation_id: completeStoreCart
    path: /store/carts/{id}/complete
    method: POST
    summary: 完成购物车并创建订单
    module: checkout
    requirement_ids: [R0003]
    authentication: x-publishable-api-key
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    responses:
      - status_code: 200
        body_schema: {$ref: "#/components/schemas/OrderResponse"}
      - status_code: 404
        body_schema: {$ref: "#/components/schemas/ErrorResponse"}
