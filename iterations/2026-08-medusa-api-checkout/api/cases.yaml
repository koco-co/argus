  - api_case_id: A0007
    requirement_ids: [R0002]
    operation_id: applyStoreCartPromotions
    endpoint: /store/carts/{id}/promotions
    method: POST
    title: 应用 ARGUS10 并返回折后购物车
    case_type: happy_path
    side_effect: updates
    module: checkout
    request:
      path_params: { id: "${cart_id}" }
      body: { promo_codes: ["${promotion_code}"] }
      variables:
        - name: cart_id
          source: prev_response
          expression: $.cart.id
        - name: promotion_code
          source: seed
          expression: $.discount_argus10.value
    expected_response:
      status_code: 200
      body_schema: { $ref: "#/components/schemas/CartResponse" }
      body_assertions:
        - path: "$.cart.discount_total"
          operator: derived_equals
          value_type: number
          expected: discount_total
        - path: "$.cart.total"
          operator: derived_equals
          value_type: number
          expected: total
      derived_oracles:
        - name: discount_total
          target_path: "$.cart.discount_total"
          expression: product_price_eur * discount_argus10.percentage / 100
          inputs:
            - name: product_price_eur
              source: seed
              path: "$.product_price_eur.value"
            - name: discount_argus10
              source: seed
              path: "$.discount_argus10.percentage"
          value_type: number
          tolerance: 0.01
        - name: total
          target_path: "$.cart.total"
          expression: product_price_eur * (100 - discount_argus10.percentage) / 100
          inputs:
            - name: product_price_eur
              source: seed
              path: "$.product_price_eur.value"
            - name: discount_argus10
              source: seed
              path: "$.discount_argus10.percentage"
          value_type: number
          tolerance: 0.01
