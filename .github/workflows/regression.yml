name: e2e

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]] || [[ "${{ github.base_ref }}" == "release" ]]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -Eq '^(automation|iterations)/'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      ARGUS_BASE_URL: http://localhost:8000
      ARGUS_API_BASE_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/target_app_up.py
      - run: uv run python scripts/target_app_healthcheck.py
      - run: uv run python -m shared.config.settings assemble --env ci
      - id: regression
        shell: bash
        run: |
          set +e
          TEST_ENV=ci uv run pytest automation/web automation/api --junitxml=reports/junit.xml --alluredir=reports/allure-results
          first=$?
          classification="normal"
          if [[ $first -ne 0 ]]; then
            TEST_ENV=ci uv run pytest automation/web automation/api --junitxml=reports/junit.xml --alluredir=reports/allure-results
            second=$?
            if [[ $second -eq 0 ]]; then
              classification="flaky-suspect"
            else
              classification="failed"
            fi
          else
            second=0
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          exit "$second"
      - if: "${{ always() && hashFiles('reports/junit.xml') != '' }}"
        run: uv run python scripts/self_debug_helper.py record-ci-auto --junit reports/junit.xml --env ci
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-evidence-${{ github.run_id }}
          path: |
            reports/
            iterations/*/runs/
          retention-days: 14
      - if: "${{ always() && hashFiles('reports/junit.xml') != '' }}"
        continue-on-error: true
        run: uv run python scripts/notify.py --summary auto --classification "${{ steps.regression.outputs.classification }}"
      - if: "${{ always() && hashFiles('reports/junit.xml') == '' }}"
        continue-on-error: true
        shell: bash
        run: |
          status=success
          if [[ "${{ failure() }}" == "true" ]]; then
            status=failure
          elif [[ "${{ cancelled() }}" == "true" ]]; then
            status=cancelled
          fi
          uv run python scripts/notify.py --job e2e --status "$status"
      - if: ${{ always() && github.event_name == 'schedule' && steps.regression.outputs.classification == 'failed' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/weekly_escalation.py --classification failed
      - if: ${{ always() }}
        run: uv run python scripts/target_app_down.py
