# Static-checks CI (Roadmap 1.16; job shape per ARCHITECTURE §8).
# e2e 位于 regression.yml；可信通知由 trusted-notifications.yml 负责。
# 本工作流执行 PR 控制代码，因此不接触通知 Secret 或写权限。
#
# Hardening contract (ARCHITECTURE §8): actions pinned to full commit SHAs,
# minimal top-level permissions, explicit timeout-minutes, PR-scoped
# concurrency that cancels superseded runs.
name: static-checks

permissions: {}

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      force_failure:
        description: "仅用于验收失败通知分支"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARGUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run pre-commit run --all-files
      - run: uv run pytest scripts/tests
      - name: 校验 PR 变更范围覆盖
        shell: bash
        run: |
          if [[ -n "$ARGUS_BASE_SHA" ]]; then
            uv run python scripts/check_coverage.py --tier from-iteration --changed-base "$ARGUS_BASE_SHA"
          else
            uv run python scripts/check_coverage.py --tier from-iteration
          fi
      # This target is also the local static-gate entry point. It includes
      # schemas, semantic iteration gates, coverage, layering, read-only and
      # production-scope checks, orphan detection, API model checks, README,
      # Pyright, Ruff and all Skill golden baselines.
      - run: make static-gates
      - name: 强制失败验收探针
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure }}
        run: exit 1
