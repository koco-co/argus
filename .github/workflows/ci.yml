# Static-checks CI (Roadmap 1.16; job shape per ARCHITECTURE §8).
# e2e 位于 regression.yml；static-checks 与 e2e 都在 always() 路径调用通知器，
# 通知失败不改变权威检查结论。
#
# Hardening contract (ARCHITECTURE §8): actions pinned to full commit SHAs,
# minimal top-level permissions, explicit timeout-minutes, PR-scoped
# concurrency that cancels superseded runs.
name: static-checks

permissions: {}

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pre-commit run --all-files
      - run: uv run pytest scripts/tests
      - run: uv run python scripts/check_coverage.py --tier from-iteration
      # Roadmap 1.17: any future TEST_ENV=prod run requires this green scan.
      - run: uv run python scripts/check_prod_scope.py --all
      # Roadmap 1.18: no hand-written test can slip in through the side door.
      - run: uv run python scripts/check_orphan_tests.py
      - if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          status=success
          if [[ "${{ failure() }}" == "true" ]]; then
            status=failure
          elif [[ "${{ cancelled() }}" == "true" ]]; then
            status=cancelled
          fi
          uv run python scripts/notify.py --job static-checks --status "$status"
