[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-core"
version = "0.2.0"
description = "Argus 0.2 control-plane contracts and lifecycle store"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
argus = "argus_core.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus_core = ["schemas/*.json", "schemas/*.yaml"]
