# config/env.example.yaml — committed placeholder shape (ARCHITECTURE §7.1).
# Copy to config/env.local.yaml (gitignored) and fill real values at M8.
#
# DB ROLE (Layer 1 of ARCHITECTURE §6 — the authoritative read-only control):
# the `db.dsn` below MUST point to a SELECT-only-granted role. Code checks
# (check_db_readonly.py, shared/db/readonly_client.py) are defense-in-depth
# only; deploy the role with SELECT grants and nothing else.
#
# auth/db blocks are optional: guest flows need neither (PRD §4.1/§7.1).

base_url: "https://CHANGE_ME.example"   # storefront base URL under test
api_base_url: "https://CHANGE_ME_API.example"  # UI/API 组合执行时可选的后端地址

auth:                                    # optional — omit for guest-only runs
  username: "CHANGE_ME"
  password: "CHANGE_ME"

db:                                      # optional — SELECT-only role, see above
  dsn: "postgresql://CHANGE_ME_READONLY_ROLE:CHANGE_ME@CHANGE_ME_HOST:5432/CHANGE_ME_DB"

cookies: {}
