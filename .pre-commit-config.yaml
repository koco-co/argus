# Pre-commit guardrails (Roadmap 0.3; finalized at 1.16).
#
# - Remote ruff hooks enforce immediately (format check-only - no hook
#   mutates tracked files during a check).
# - All four local validator hooks are REAL since Phase 1 (1.2/1.3/1.9/1.13)
#   and enforce for real, including rejecting a modified source payload and
#   hand-edited iteration files.
# - No hook may mutate tracked files during a check: local hooks are
#   read-only validators (fix modes are explicit, separate CLI invocations
#   committed by a human/bot afterwards).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: validate-schema
        name: validate-schema (registered iteration artifacts via schema_registry.yaml)
        entry: uv run python scripts/validate_schema.py
        language: system
        files: ^iterations/.*\.yaml$
        require_serial: true
      - id: validate-iteration-state
        name: validate-iteration-state (state machine + staleness)
        entry: uv run python scripts/validate_iteration.py
        language: system
        files: ^iterations/[^/]+/iteration\.yaml$
        require_serial: true
      - id: no-db-writes
        name: no-db-writes (write-verb scan on DB-touching code)
        entry: uv run python scripts/check_db_readonly.py
        language: system
        files: ^(shared/(db|assertions)|automation)/.*\.py$
        require_serial: true
      - id: check-secrets
        name: check-secrets (credential-pattern scan over iteration text incl. 00-raw)
        entry: uv run python scripts/check_secrets.py
        language: system
        files: ^iterations/.+/
        require_serial: true
